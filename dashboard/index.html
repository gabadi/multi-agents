<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fabric Monitor v2</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131a2c;
      --card: #1a2338;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #2a3550;
      --blue: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .tabs { display: flex; gap: 8px; }
    .tab-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active {
      color: #dbeafe;
      border-color: var(--blue);
      background: rgba(59, 130, 246, .16);
    }

    .statusline {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .content { padding: 16px; }
    .view { display: none; }
    .view.active { display: block; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .warning {
      border: 1px solid rgba(239, 68, 68, .6);
      background: rgba(239, 68, 68, .12);
      color: #fecaca;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .ok {
      border: 1px solid rgba(34, 197, 94, .5);
      background: rgba(34, 197, 94, .12);
      color: #bbf7d0;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      text-align: left;
      padding: 8px;
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; }

    .badge {
      display: inline-block;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-idle, .status-queued, .status-registering { color: #86efac; border-color: rgba(34,197,94,.45); background: rgba(34,197,94,.12); }
    .status-processing, .status-turn_active, .status-waiting_llm, .status-agent_starting, .status-processing_inbox, .status-streaming, .status-thinking { color: #93c5fd; border-color: rgba(59,130,246,.45); background: rgba(59,130,246,.12); }
    .status-error, .status-offline, .status-blocked { color: #fecaca; border-color: rgba(239,68,68,.5); background: rgba(239,68,68,.14); }

    .muted { color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    .task-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #11192d;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .task-head {
      padding: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .task-title { font-weight: 700; }

    .subtasks {
      padding: 8px 10px 10px;
      display: grid;
      gap: 8px;
    }
    .subtask {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      background: #0f172a;
      font-size: 12px;
    }

    .pill {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 7px;
      margin-right: 4px;
      font-size: 11px;
      color: #cbd5e1;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title">Fabric Monitor v2</div>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="agents">Agentes</button>
        <button class="tab-btn" data-tab="projects">Proyectos</button>
        <button class="tab-btn" data-tab="tasks">Tareas + Subtareas</button>
      </nav>
      <div class="statusline">
        <span id="connState">API: ...</span>
        <span id="lastRefresh">Última actualización: -</span>
      </div>
    </header>

    <main class="content">
      <section id="view-agents" class="view active">
        <div class="card">
          <h2>Jerarquía de agentes</h2>
          <div id="agentsInvariant"></div>
          <div id="agentsTableWrap"></div>
        </div>
      </section>

      <section id="view-projects" class="view">
        <div class="card">
          <h2>Resumen de proyectos</h2>
          <div id="projectsTableWrap"></div>
        </div>
      </section>

      <section id="view-tasks" class="view">
        <div class="card">
          <h2>Tareas y subtareas</h2>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center;">
            <label class="muted">Proyecto
              <select id="filterProject" style="margin-left:6px; background:#0f172a; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px;">
                <option value="">Todos</option>
              </select>
            </label>
            <label class="muted">Task ID
              <input id="filterTaskId" type="number" min="1" placeholder="ej: 42" style="margin-left:6px; width:120px; background:#0f172a; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px;" />
            </label>
            <label class="muted">Status
              <select id="filterStatus" style="margin-left:6px; background:#0f172a; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px;">
                <option value="">Todos</option>
                <option value="draft">draft</option>
                <option value="in_progress">in_progress</option>
                <option value="completed">completed</option>
                <option value="failed">failed</option>
              </select>
            </label>
            <button id="applyTaskFilters" class="action-btn" style="padding:6px 10px; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--text); cursor:pointer;">Aplicar</button>
            <button id="resetTaskFilters" class="action-btn" style="padding:6px 10px; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--text); cursor:pointer;">Limpiar</button>
          </div>
          <div id="tasksWrap"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const state = {
      activeTab: 'agents',
      agents: null,
      projects: null,
      tasks: null,
      taskFilters: {
        project_id: '',
        task_id: '',
        status: '',
      },
    };

    const el = {
      connState: document.getElementById('connState'),
      lastRefresh: document.getElementById('lastRefresh'),
      agentsInvariant: document.getElementById('agentsInvariant'),
      agentsTableWrap: document.getElementById('agentsTableWrap'),
      projectsTableWrap: document.getElementById('projectsTableWrap'),
      tasksWrap: document.getElementById('tasksWrap'),
      filterProject: document.getElementById('filterProject'),
      filterTaskId: document.getElementById('filterTaskId'),
      filterStatus: document.getElementById('filterStatus'),
      applyTaskFilters: document.getElementById('applyTaskFilters'),
      resetTaskFilters: document.getElementById('resetTaskFilters'),
    };

    function setConn(ok, note = '') {
      el.connState.textContent = ok ? `API: ok ${note}` : `API: error ${note}`;
      el.connState.style.color = ok ? '#86efac' : '#fecaca';
    }

    function markRefresh() {
      el.lastRefresh.textContent = `Última actualización: ${new Date().toLocaleTimeString()}`;
    }

    async function fetchJson(url, allow409 = false) {
      const res = await fetch(url);
      if (!res.ok && !(allow409 && res.status === 409)) {
        throw new Error(`${res.status} ${res.statusText}`);
      }
      return await res.json();
    }

    function statusBadge(value) {
      const v = String(value || 'unknown');
      const klass = `status-${v.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
      return `<span class="badge ${klass}">${v}</span>`;
    }

    async function loadAgents() {
      const data = await fetchJson('/api/agents?hierarchy=true', true);
      state.agents = data;
      renderAgents();
    }

    async function loadProjects() {
      const data = await fetchJson('/api/projects/summary');
      state.projects = data;
      renderProjects();
      renderTaskProjectOptions();
    }

    function buildTasksUrl() {
      const params = new URLSearchParams();
      params.set('include_subtasks', 'true');
      const { project_id, task_id, status } = state.taskFilters;
      if (project_id) params.set('project_id', project_id);
      if (task_id) params.set('task_id', task_id);
      if (status) params.set('status', status);
      return `/api/tasks?${params.toString()}`;
    }

    async function loadTasks() {
      if (!state.projects) {
        // Keep project selector in sync when entering tasks first.
        await loadProjects();
      }
      const data = await fetchJson(buildTasksUrl());
      state.tasks = data;
      renderTasks();
    }

    async function refreshActiveView() {
      try {
        if (state.activeTab === 'agents') await loadAgents();
        if (state.activeTab === 'projects') await loadProjects();
        if (state.activeTab === 'tasks') await loadTasks();
        setConn(true);
        markRefresh();
      } catch (err) {
        console.error(err);
        setConn(false, `(${err.message || err})`);
      }
    }

    const refreshTimers = new Map();
    function scheduleActiveRefresh(reason = '') {
      const key = state.activeTab;
      if (refreshTimers.has(key)) return;
      const timer = setTimeout(async () => {
        refreshTimers.delete(key);
        await refreshActiveView();
        if (reason) console.debug('sse refresh', key, reason);
      }, 250);
      refreshTimers.set(key, timer);
    }

    function setupSse() {
      const es = new EventSource('/api/stream');

      es.onopen = () => {
        setConn(true, '(sse)');
      };

      es.onerror = () => {
        setConn(false, '(sse disconnected)');
      };

      const agentEvents = ['snapshot', 'agent-update', 'agent-registered', 'agent-offline', 'agent-back', 'agent-removed', 'agent-blocked'];
      const projectEvents = ['projects-snapshot'];
      const taskEvents = ['task-update', 'subtask-update', 'subtask-assigned'];

      agentEvents.forEach(name => es.addEventListener(name, () => {
        if (state.activeTab === 'agents') scheduleActiveRefresh(name);
      }));

      projectEvents.forEach(name => es.addEventListener(name, () => {
        if (state.activeTab === 'projects') scheduleActiveRefresh(name);
      }));

      taskEvents.forEach(name => es.addEventListener(name, () => {
        if (state.activeTab === 'tasks') scheduleActiveRefresh(name);
      }));

      // Generic PM events stream fallback.
      es.addEventListener('project-event', () => {
        if (state.activeTab === 'projects' || state.activeTab === 'tasks') {
          scheduleActiveRefresh('project-event');
        }
      });

      return es;
    }

    function renderAgents() {
      const payload = state.agents;
      if (!payload || !Array.isArray(payload.items)) {
        el.agentsTableWrap.innerHTML = '<div class="empty">Sin datos.</div>';
        return;
      }

      const inv = payload.invariants || { secretary_under_subcoordinator_ok: true, violations: [] };
      if (inv.secretary_under_subcoordinator_ok) {
        el.agentsInvariant.innerHTML = '<div class="ok">Invariante OK: secretary está bajo sub-coordinator.</div>';
      } else {
        const rows = (inv.violations || []).map(v => `<li class="mono">${v.agent_id}: ${v.reason} (parent=${v.parent_agent_id || 'null'})</li>`).join('');
        el.agentsInvariant.innerHTML = `<div class="warning"><b>Violaciones de jerarquía</b><ul>${rows}</ul></div>`;
      }

      const rows = payload.items
        .sort((a, b) => String(a.role).localeCompare(String(b.role)) || String(a.agent_id).localeCompare(String(b.agent_id)))
        .map(a => `
          <tr>
            <td class="mono">${a.agent_id}</td>
            <td>${a.role}</td>
            <td>${statusBadge(a.fabric_status || a.status)}</td>
            <td class="mono">${a.current_task || '-'}</td>
            <td class="mono">${a.parent_agent_id || '-'}</td>
            <td>${a.children_count ?? 0}</td>
            <td class="muted">${a.last_seen_at || '-'}</td>
          </tr>
        `)
        .join('');

      el.agentsTableWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>agent_id</th>
              <th>role</th>
              <th>status</th>
              <th>current_task</th>
              <th>parent_agent_id</th>
              <th>children</th>
              <th>last_seen_at</th>
            </tr>
          </thead>
          <tbody>${rows || '<tr><td colspan="7" class="empty">Sin agentes</td></tr>'}</tbody>
        </table>
      `;
    }

    function renderProjects() {
      const items = state.projects?.items;
      if (!Array.isArray(items)) {
        el.projectsTableWrap.innerHTML = '<div class="empty">Sin datos.</div>';
        return;
      }

      const rows = items.map(p => `
        <tr>
          <td>${p.project_id}</td>
          <td class="mono">${p.code || '-'}</td>
          <td>${p.name || '-'}</td>
          <td>${p.task_counts?.draft ?? 0}</td>
          <td>${p.task_counts?.in_progress ?? 0}</td>
          <td>${p.task_counts?.completed ?? 0}</td>
          <td>${p.task_counts?.failed ?? 0}</td>
          <td>${p.subtask_count ?? 0}</td>
        </tr>
      `).join('');

      el.projectsTableWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>project_id</th>
              <th>code</th>
              <th>name</th>
              <th>draft</th>
              <th>in_progress</th>
              <th>completed</th>
              <th>failed</th>
              <th>subtasks</th>
            </tr>
          </thead>
          <tbody>${rows || '<tr><td colspan="8" class="empty">Sin proyectos</td></tr>'}</tbody>
        </table>
      `;
    }

    function renderTaskProjectOptions() {
      const items = state.projects?.items;
      if (!Array.isArray(items)) return;
      const current = state.taskFilters.project_id || '';
      const options = ['<option value="">Todos</option>']
        .concat(items.map(p => `<option value="${p.project_id}">#${p.project_id} ${p.name || '(sin nombre)'}</option>`))
        .join('');
      el.filterProject.innerHTML = options;
      el.filterProject.value = current;
    }

    function renderTasks() {
      const items = state.tasks?.items;
      if (!Array.isArray(items)) {
        el.tasksWrap.innerHTML = '<div class="empty">Sin datos.</div>';
        return;
      }

      const f = state.tasks?.filters || {};
      const filterLine = `<div class="muted" style="margin:0 0 8px;">Filtros activos: project_id=${f.project_id || '-'} task_id=${f.task_id || '-'} status=${f.status || '-'}</div>`;

      if (items.length === 0) {
        el.tasksWrap.innerHTML = `${filterLine}<div class="empty">No hay tareas para esos filtros.</div>`;
        return;
      }

      el.tasksWrap.innerHTML = filterLine + items.map(task => {
        const subtasks = Array.isArray(task.subtasks) ? task.subtasks : [];
        const subtasksHtml = subtasks.length
          ? subtasks.map(sub => `
              <div class="subtask">
                <div><b>#${sub.id}</b> ${sub.title || '(sin título)'} • <span class="muted">status=${sub.status}</span></div>
                <div class="muted">worker=${sub.worker_agent_id || '-'} qa=${sub.qa_agent_id || '-'}</div>
                <div class="muted">depends_on=${(sub.depends_on || []).join(',') || '-'}</div>
                <div>${(sub.assignment_types || []).map(a => `<span class="pill">${a}</span>`).join('') || '<span class="muted">sin assignment_types</span>'}</div>
              </div>
            `).join('')
          : '<div class="empty">Sin subtareas</div>';

        return `
          <div class="task-box">
            <div class="task-head">
              <div>
                <div class="task-title">#${task.id} ${task.title || '(sin título)'}</div>
                <div class="muted mono">project=${task.project_id} owner=${task.owner_agent_id || '-'} status=${task.status}</div>
              </div>
              <div class="muted">subtasks: ${subtasks.length}</div>
            </div>
            <div class="subtasks">${subtasksHtml}</div>
          </div>
        `;
      }).join('');
    }

    function switchTab(tab) {
      state.activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      document.getElementById(`view-${tab}`).classList.add('active');
      refreshActiveView();
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    el.applyTaskFilters.addEventListener('click', async () => {
      state.taskFilters.project_id = el.filterProject.value.trim();
      state.taskFilters.task_id = el.filterTaskId.value.trim();
      state.taskFilters.status = el.filterStatus.value.trim();
      state.activeTab = 'tasks';
      await loadTasks();
      setConn(true);
      markRefresh();
    });

    el.resetTaskFilters.addEventListener('click', async () => {
      state.taskFilters = { project_id: '', task_id: '', status: '' };
      el.filterProject.value = '';
      el.filterTaskId.value = '';
      el.filterStatus.value = '';
      state.activeTab = 'tasks';
      await loadTasks();
      setConn(true);
      markRefresh();
    });

    // Initial load
    refreshActiveView();

    // Incremental updates via SSE + low-frequency polling fallback.
    setupSse();
    setInterval(refreshActiveView, 20000);
  </script>
</body>
</html>
